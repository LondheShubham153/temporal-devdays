[project]
name = "temporal-devdays-python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["temporalio>=1.36.1"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
